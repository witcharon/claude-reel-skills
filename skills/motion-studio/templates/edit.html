<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FILM</title>
<style>
/* Fonts: install what style_guide.md names (npm i @fontsource/<family> in the promo root) and point these rules at it.
   The two below are placeholders so the page runs; they are not a house style. */
@font-face{font-family:Display;src:url(node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:UI;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format('woff2');font-weight:500}
/* The look: every value here comes from style_guide.md */
:root{
  --ground:#101010; --ink:#f4f4f4; --accent:#ffffff;
  --display:Display; --display-weight:800; --display-style:normal; --display-case:none; --display-tracking:-.02em; --display-leading:.95;
  --text:Display; --ui:UI;
}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:var(--text),sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cam{transform-origin:540px 960px}
#cam>img{position:absolute;left:0;top:0;width:1080px;height:1920px}
/* kinetic type: centred on the frame; inside the right-button band keep lines within x 190-890 */
.title{position:absolute;left:0;width:1080px;text-align:center;font-family:var(--display);font-weight:var(--display-weight);font-style:var(--display-style);
  text-transform:var(--display-case);letter-spacing:var(--display-tracking);line-height:var(--display-leading);white-space:nowrap}
.title .ln{display:block}
.title .w{display:inline-block;padding:0 .045em}
.title .w+.w{margin-left:.2em}
#grain{mix-blend-mode:overlay;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="cam" class="full"><img id="plate"></div>
  <div class="title" style="top:900px;font-size:96px" data-out="2.2">
    <span class="ln"><span class="w" data-at=".3">first</span><span class="w" data-at=".45">line</span></span>
  </div>
  <canvas id="grain" class="full" width="540" height="960"></canvas>
</div>
<script type="module">
import { clamp, springP, track, snap, bindTitles, css, shake, grain, setImg, plateIndex } from './lib/motion.js';

// Takes: plates/meta.json from plates.py. Pure motion films have no plates: set T.end and draw every scene from t.
const meta = await fetch('plates/meta.json').then(r => r.ok ? r.json() : null).catch(() => null);
const FPS = meta?.fps ?? 24, N = meta?.frames.length ?? 0;
const T = { end: N ? N / FPS : 10 };              // story beats from shotlist.md live here, on the grid
const HITS = [];                                  // [[t, px, decay], ...] camera impulses
const drawTitles = bindTitles(document);
const $ = id => document.getElementById(id), plate = $('plate');

window.renderAt = async t => {
  if (meta) {
    const n = plateIndex(t, FPS, N), fr = meta.frames[n];
    plate.style.display = fr.plate ? 'block' : 'none';
    if (fr.plate) await setImg(plate, `plates/p_${String(n).padStart(4, '0')}.jpg`);
  } else plate.style.display = 'none';
  const sh = shake(t, HITS, FPS);
  css($('cam'), { transform: `translate(${sh.x}px,${sh.y}px) rotate(${sh.r}deg)` });
  drawTitles(t);
  grain($('grain'), Math.floor(t * FPS));          // its opacity is the style guide's texture (0 = none)
};
await document.fonts.ready;
await window.renderAt(0);
window.ready = true;
</script>
</body>
</html>
